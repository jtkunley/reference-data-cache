name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke-test ESM and CJS entry points
        run: |
          node -e "const m = require('reference-data-cache'); if (typeof m.createCacheOwner !== 'function') process.exit(1)"
          node --input-type=module -e "import { createCacheOwner } from 'reference-data-cache'; if (typeof createCacheOwner !== 'function') process.exit(1)"
      - run: npm pack --dry-run
